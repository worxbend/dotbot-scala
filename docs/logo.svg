<svg width="960" height="300" viewBox="0 0 960 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">dotbot-scala logo</title>
  <desc id="desc">A terminal mark connected to dot nodes beside the dotbot-scala wordmark.</desc>
  <defs>
    <linearGradient id="panel" x1="115" y1="44" x2="350" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14213D"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="accent" x1="135" y1="67" x2="310" y2="234" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D0BA"/>
      <stop offset=".52" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#F9735B"/>
    </linearGradient>
    <linearGradient id="word" x1="390" y1="95" x2="760" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14213D"/>
      <stop offset="1" stop-color="#1E5168"/>
    </linearGradient>
    <filter id="shadow" x="80" y="18" width="305" height="282" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#07111F" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="960" height="300" rx="38" fill="#F8FAFC"/>
  <path d="M0 248C118 218 184 232 288 255C423 285 534 283 666 238C785 197 862 197 960 229V300H0V248Z" fill="#E7F8F4"/>
  <path d="M0 36C126 56 211 42 323 25C463 4 565 16 675 53C789 92 869 92 960 67V0H0V36Z" fill="#FFF3EB"/>

  <g filter="url(#shadow)">
    <rect x="109" y="46" width="248" height="208" rx="32" fill="url(#panel)"/>
    <rect x="129" y="70" width="208" height="38" rx="14" fill="#F8FAFC" fill-opacity=".1"/>
    <circle cx="153" cy="89" r="6" fill="#F9735B"/>
    <circle cx="174" cy="89" r="6" fill="#F4C95D"/>
    <circle cx="195" cy="89" r="6" fill="#6EE7B7"/>

    <path d="M156 155L190 178L156 201" stroke="#F8FAFC" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M207 207H266" stroke="#35D0BA" stroke-width="15" stroke-linecap="round"/>

    <path d="M243 143C266 122 289 122 312 143" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <path d="M243 143C266 164 289 164 312 143" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="243" cy="143" r="13" fill="#35D0BA" stroke="#07111F" stroke-width="5"/>
    <circle cx="312" cy="143" r="13" fill="#F9735B" stroke="#07111F" stroke-width="5"/>
    <circle cx="277" cy="184" r="13" fill="#F4C95D" stroke="#07111F" stroke-width="5"/>
    <path d="M250 151L269 176" stroke="#F8FAFC" stroke-opacity=".45" stroke-width="6" stroke-linecap="round"/>
    <path d="M304 153L285 176" stroke="#F8FAFC" stroke-opacity=".45" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="397" y="136" fill="url(#word)" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="800" letter-spacing="0">dotbot-scala</text>
  <text x="400" y="181" fill="#476173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="600" letter-spacing="0">fast, typed dotfile bootstrapper</text>

  <g transform="translate(401 207)">
    <rect width="121" height="34" rx="10" fill="#14213D"/>
    <text x="18" y="23" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="0">Scala 3</text>
    <rect x="136" width="112" height="34" rx="10" fill="#35D0BA"/>
    <text x="154" y="23" fill="#07111F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="0">Dotbot</text>
    <rect x="263" width="106" height="34" rx="10" fill="#F9735B"/>
    <text x="282" y="23" fill="#07111F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="0">Native</text>
  </g>
</svg>
